    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Imyanya",
        "url": "https://imyanya.rw/",
        "description": "Find jobs in Rwanda, Kigali vacancies, internships, NGO jobs, and connect with employers hiring qualified candidates on Imyanya.",
        "inLanguage": ["en-RW", "rw-RW"],
        "areaServed": {

          "name": "Rwanda"
        },
        "potentialAction": {
          "@type": "SearchAction",

        }

    <style>
      df-messenger {
        --df-messenger-bot-message: #9c8ebd;
        --df-messenger-button-titlebar-color: #441da0;
        --df-messenger-button-titlebar-font-color: #ffffff;
        --df-messenger-chat-background-color: #f8f9fa;
        --df-messenger-font-color: #ffffff;
        --df-messenger-input-box-color: #ffffff;
        --df-messenger-input-font-color: #333333;

        --df-messenger-send-icon: #441da0;
        --df-messenger-user-message: #441da0;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      #initial-loader {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-in-out;
      }

      .loading-spinner {
        opacity: 1;
        transition: opacity 0.5s ease-in-out;
      }

      .loading-spinner img {
        width: 100px;
        height: auto;
      }

      .fade-out {
        opacity: 0 !important;
      }

      .crawler-legal-links {
        padding: 16px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }

      .crawler-legal-links a {
        color: #441da0;
        margin: 0 8px;
      }
    </style>
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
