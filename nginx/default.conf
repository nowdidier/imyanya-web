    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name employers.imyanya.rw www.employers.imyanya.rw;
    
    # SSL certificates (can share or use separate)
    ssl_certificate /etc/ssl/certs/employers.imyanya.rw.crt;
    ssl_certificate_key /etc/ssl/private/employers.imyanya.rw.key;
    ssl_protocols TLSv1.2 TLSv1.3;
