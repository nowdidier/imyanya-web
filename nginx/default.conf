# Nginx configuration for imyanya.rw and employers.imyanya.rw

# Upstream backend
upstream api_backend {
    server philosophical-ariel-novarwa-4fd2a870.koyeb.app;
}

# Cache setup
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=react_cache:10m max_size=1g inactive=60m use_temp_path=off;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name imyanya.rw www.imyanya.rw employers.imyanya.rw www.employers.imyanya.rw;
    
    return 301 https://$server_name$request_uri;
}

# Main imyanya.rw server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imyanya.rw www.imyanya.rw;
    
    # SSL certificates (use your own)
    ssl_certificate /etc/ssl/certs/imyanya.rw.crt;
    ssl_certificate_key /etc/ssl/private/imyanya.rw.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    root /var/www/imyanya-web/build;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_min_length 1000;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # API proxy
    location /api/ {
        proxy_pass https://philosophical-ariel-novarwa-4fd2a870.koyeb.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # SPA routing - route all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 0;
        add_header Cache-Control "public, max-age=0";
    }
}

# Employers subdomain server block
