    <title>IMYANYA | Jobs in Rwanda | Imyanya y'akazi</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IMYANYA",
        "url": "https://imyanya.rw/",
        "description": "Find jobs in Rwanda, Kigali vacancies, internships, NGO jobs, and connect with employers hiring qualified candidates on IMYANYA.",
        "inLanguage": ["en-RW", "rw-RW"],
        "areaServed": {
          "@type": "Country",
          "name": "Rwanda"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://imyanya.rw/jobs-in-rwanda?kw={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <style>
      df-messenger {
        --df-messenger-bot-message: #9c8ebd;
        --df-messenger-button-titlebar-color: #441da0;
        --df-messenger-button-titlebar-font-color: #ffffff;
        --df-messenger-chat-background-color: #f8f9fa;
        --df-messenger-font-color: #ffffff;
        --df-messenger-input-box-color: #ffffff;
        --df-messenger-input-font-color: #333333;
        --df-messenger-input-placeholder-font-color: #969db6;
        --df-messenger-minimized-chat-close-icon-color: #441da0;
        --df-messenger-send-icon: #441da0;
        --df-messenger-user-message: #441da0;
      }
      
      @keyframes spin {
        from {
         transform: rotate(0deg);
        }
        to {
         transform: rotate(360deg);
        }
      }
      
      #initial-loader {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        opacity: 1;
       transition: opacity 0.5s ease-in-out;
      }
      
      .loading-spinner {
        opacity: 1;
       transition: opacity 0.5s ease-in-out;
      }
      
      .loading-spinner img {
        width: 100px;
        height: auto;
      }
      
      .fade-out {
        opacity: 0 !important;
      }
    </style>
     <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
